name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint, types and unit tests need no external services.
  verify:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint

      # tsc exhausts the default heap on this project.
      - run: npm run type-check
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - run: npm run test

  # The accessibility gate builds and serves the app, so it needs the same
  # public Supabase credentials the storefront reads at request time.
  # Required repository secrets: SUPABASE_URL, SUPABASE_ANON_KEY.
  a11y:
    name: Accessibility (axe-core)
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Fail loudly and early rather than letting `next build` produce a broken
      # app that the axe scan would then report as "accessible".
      - name: Check required secrets are configured
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL and SUPABASE_ANON_KEY repository secrets must be set for the a11y job."
            exit 1
          fi

      - run: npx playwright install --with-deps chromium

      # playwright.config.ts runs `next build && next start` via webServer.
      - run: npm run test:a11y

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
