name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint, types and unit tests need no external services.
  verify:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint

      # tsc exhausts the default heap on this project.
      - run: npm run type-check
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - run: npm run test

  # The accessibility gate needs an app to scan. There are two ways to give it
  # one, chosen entirely by configuration under
  # Settings > Secrets and variables > Actions:
  #
  #   1. Set PLAYWRIGHT_BASE_URL to a deployed URL (e.g. a Vercel preview).
  #      playwright.config.ts then skips its webServer entirely — no build here,
  #      no Supabase values needed, and the scan hits the artifact that ships.
  #
  #   2. Otherwise set NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_ANON_KEY
  #      and this job builds and serves the app itself.
  #
  # The names match .env.local exactly so values can be copied across as-is.
  # Both Supabase values carry the NEXT_PUBLIC_ prefix, meaning Next inlines
  # them into the client bundle and every visitor's browser already has them —
  # so repository *variables* are appropriate here. They are read as variables
  # first and fall back to secrets, so either choice works unchanged.
  a11y:
    name: Accessibility (axe-core)
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BASE_URL: ${{ vars.PLAYWRIGHT_BASE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Fail loudly and early rather than letting `next build` produce a
      # credential-less app that the axe scan would then report as "accessible".
      # This job must never skip silently — a gate that quietly does not run is
      # the exact problem it was added to solve.
      - name: Check the a11y job has something to scan
        run: |
          if [ -n "$PLAYWRIGHT_BASE_URL" ]; then
            echo "Scanning deployed app at $PLAYWRIGHT_BASE_URL — skipping local build."
            exit 0
          fi
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::error::The a11y job needs either PLAYWRIGHT_BASE_URL (scan a deployment) or NEXT_PUBLIC_SUPABASE_URL + NEXT_PUBLIC_SUPABASE_ANON_KEY (build here). Add them under Settings > Secrets and variables > Actions. The Supabase pair is NEXT_PUBLIC_ and already public in the client bundle, so repository variables are fine — secrets are not required."
            exit 1
          fi
          echo "Building and serving the app locally for the scan."

      - run: npx playwright install --with-deps chromium

      # With PLAYWRIGHT_BASE_URL set this hits the deployment directly;
      # otherwise playwright.config.ts runs `next build && next start`.
      - run: npm run test:a11y

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
